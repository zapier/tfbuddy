name: tag new release

on:
  workflow_dispatch:

# Each job grants itself only what it needs, so the release tooling never
# holds the package scope and the image build never holds the repo scope
permissions: {}

# Two dispatches racing each other would compute the same version twice
concurrency:
  group: tag-new-release
  cancel-in-progress: false

jobs:
  # Work out the version first, so the image can be built and pushed before
  # anything user visible exists. A failure here leaves no tag and no release.
  next-version:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.dry-run.outputs.version }}
    steps:
      - name: checkout the source code
        uses: actions/checkout@v4
        with:
          # semantic-release needs the full history and all tags to work out
          # the previous release and the commits since then
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The exec plugin writes the version to the step output. It only runs
      # when there is something to release, so the output stays empty when
      # the commits since the last tag do not warrant one.
      - name: work out the next version
        id: dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/semantic-release --dry-run

  # Reuses the image build that the release event already runs
  build:
    needs: next-version
    if: needs.next-version.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/on_tag.yaml
    secrets: inherit
    with:
      git_tag: v${{ needs.next-version.outputs.version }}

  # Only once the image is pushed: tag the commit and publish the release
  release:
    needs: [next-version, build]
    if: needs.next-version.outputs.version != ''
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: checkout the source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/semantic-release
