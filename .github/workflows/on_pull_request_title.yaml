name: pr title

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  # The PR title becomes the commit subject on squash merge, and those commits
  # are what on_dispatch_release.yaml reads to work out the next version.
  semantic-title:
    runs-on: ubuntu-22.04
    steps:
      # No types listed: the action defaults to the conventional commit types,
      # which is the policy we want and one fewer copy to keep in step
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
